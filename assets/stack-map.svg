<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">The curiosity stack</title>
  <desc id="desc">A connected map from hardware through firmware and services to interface.</desc>
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset=".5" stop-color="#8bd5ca"/>
      <stop offset="1" stop-color="#c6a0f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="#0d1117"/>
  <path d="M169 131 H1034" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-dasharray="8 9" stroke-linecap="round"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g transform="translate(52 70)">
      <rect width="226" height="122" rx="14" fill="#161b22" stroke="#ffb454" stroke-opacity=".55"/>
      <text x="24" y="43" fill="#ffb454" font-size="13" font-weight="700" letter-spacing="2">01 / EDGE</text>
      <text x="24" y="77" fill="#f0f6fc" font-size="20" font-weight="700">hardware</text>
      <text x="24" y="101" fill="#8b949e" font-size="13">signals · sensors · power</text>
    </g>
    <g transform="translate(330 70)">
      <rect width="226" height="122" rx="14" fill="#161b22" stroke="#f5a97f" stroke-opacity=".55"/>
      <text x="24" y="43" fill="#f5a97f" font-size="13" font-weight="700" letter-spacing="2">02 / CONTROL</text>
      <text x="24" y="77" fill="#f0f6fc" font-size="20" font-weight="700">firmware</text>
      <text x="24" y="101" fill="#8b949e" font-size="13">state · timing · protocol</text>
    </g>
    <g transform="translate(608 70)">
      <rect width="226" height="122" rx="14" fill="#161b22" stroke="#8bd5ca" stroke-opacity=".55"/>
      <text x="24" y="43" fill="#8bd5ca" font-size="13" font-weight="700" letter-spacing="2">03 / SERVICE</text>
      <text x="24" y="77" fill="#f0f6fc" font-size="20" font-weight="700">backend</text>
      <text x="24" y="101" fill="#8b949e" font-size="13">API · data · reliability</text>
    </g>
    <g transform="translate(886 70)">
      <rect width="226" height="122" rx="14" fill="#161b22" stroke="#c6a0f6" stroke-opacity=".55"/>
      <text x="24" y="43" fill="#c6a0f6" font-size="13" font-weight="700" letter-spacing="2">04 / HUMAN</text>
      <text x="24" y="77" fill="#f0f6fc" font-size="20" font-weight="700">frontend</text>
      <text x="24" y="101" fill="#8b949e" font-size="13">clarity · feedback · flow</text>
    </g>
  </g>
