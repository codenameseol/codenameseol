<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Seol — a little taste, a lot of curiosity</title>
  <desc id="desc">A warm editorial banner introducing Seol, an influencing coder based in Seoul who builds small, real things from hardware to interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5f0"/>
      <stop offset="1" stop-color="#eeece4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#722f3e"/>
      <stop offset="1" stop-color="#ac8993"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="400" fill="none" stroke="#d8d6cd" stroke-width="1"/>
  <line x1="64" y1="352" x2="1216" y2="352" stroke="#d8d6cd" stroke-width="1"/>

  <text x="64" y="60" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#722f3e" font-weight="600">SEOL, THE INFLUENCING CODER</text>

  <text x="60" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#282823" letter-spacing="-2">
    <tspan x="60" dy="0">seol</tspan>
  </text>
  <g transform="translate(298,120)" fill="#722f3e">
    <ellipse cx="0" cy="-24" rx="11" ry="24"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(45)"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(90)"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(135)"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(180)"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(225)"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(270)"/>
    <ellipse cx="0" cy="-24" rx="11" ry="24" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="9" fill="#f7f5f0"/>
  </g>

  <text x="64" y="250" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#722f3e" letter-spacing="-0.5">
    A little taste. A lot of curiosity.
  </text>
  <text x="64" y="285" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#696860" letter-spacing="0.3">
    Building in public, from firmware to interface.
  </text>

  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#696860">
    <text x="64" y="385">SEOUL, SOUTH KOREA</text>
    <text x="1216" y="385" text-anchor="end">@CODENAMESEOL</text>
  </g>
  <rect x="64" y="325" width="46" height="2" fill="url(#accent)"/>
</svg>
