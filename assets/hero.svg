<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Seol — junior but overstacked</title>
  <desc id="desc">A dark developer profile banner showing a builder journey from firmware through backend to frontend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.57" stop-color="#121c29"/>
      <stop offset="1" stop-color="#171522"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="0.5" stop-color="#8bd5ca"/>
      <stop offset="1" stop-color="#c6a0f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1280" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="22" fill="url(#grid)"/>
  <path d="M0 347 C156 304 279 407 461 348 S775 267 957 340 S1126 390 1280 295" fill="none" stroke="url(#line)" stroke-opacity=".17" stroke-width="2"/>
  <circle cx="1104" cy="98" r="164" fill="#8bd5ca" fill-opacity=".045"/>
  <circle cx="1184" cy="68" r="90" fill="#c6a0f6" fill-opacity=".055"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="78" fill="#8bd5ca" font-size="15" font-weight="700" letter-spacing="3">SEOL / BUILD.LOG</text>
    <text x="72" y="143" fill="#f0f6fc" font-size="55" font-weight="700" letter-spacing="-2">junior but</text>
    <text x="72" y="208" fill="#ffb454" font-size="64" font-weight="700" letter-spacing="-3">overstacked.</text>
    <text x="75" y="249" fill="#a8b3c4" font-size="17">firmware → frontend → backend → wherever the bug is</text>
  </g>

  <g transform="translate(72 299)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" filter="url(#shadow)">
    <rect width="190" height="68" rx="10" fill="#18202c" stroke="#ffb454" stroke-opacity=".45"/>
    <circle cx="26" cy="34" r="8" fill="#ffb454"/>
    <text x="48" y="30" fill="#f0f6fc" font-size="13" font-weight="700">EDGE</text>
    <text x="48" y="49" fill="#a8b3c4" font-size="12">signal / firmware</text>
    <path d="M190 34 H232" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M227 28 L237 34 227 40" fill="none" stroke="#ffb454" stroke-width="2"/>

    <g transform="translate(246 0)">
      <rect width="190" height="68" rx="10" fill="#18202c" stroke="#8bd5ca" stroke-opacity=".45"/>
      <circle cx="26" cy="34" r="8" fill="#8bd5ca"/>
      <text x="48" y="30" fill="#f0f6fc" font-size="13" font-weight="700">SERVICE</text>
      <text x="48" y="49" fill="#a8b3c4" font-size="12">logic / API / data</text>
    </g>
    <path d="M436 34 H478" stroke="#8bd5ca" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M473 28 L483 34 473 40" fill="none" stroke="#8bd5ca" stroke-width="2"/>

    <g transform="translate(492 0)">
      <rect width="190" height="68" rx="10" fill="#18202c" stroke="#c6a0f6" stroke-opacity=".45"/>
      <circle cx="26" cy="34" r="8" fill="#c6a0f6"/>
      <text x="48" y="30" fill="#f0f6fc" font-size="13" font-weight="700">INTERFACE</text>
      <text x="48" y="49" fill="#a8b3c4" font-size="12">screen / human</text>
    </g>
  </g>

  <g transform="translate(892 137) rotate(-6)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" filter="url(#shadow)">
    <rect width="286" height="154" rx="14" fill="#10161f" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="23" cy="23" r="5" fill="#ff6b6b"/>
    <circle cx="40" cy="23" r="5" fill="#ffb454"/>
    <circle cx="57" cy="23" r="5" fill="#a6da95"/>
    <text x="22" y="57" fill="#c6a0f6" font-size="13">while (curious) {</text>
    <text x="39" y="83" fill="#8bd5ca" font-size="13">build();</text>
    <text x="39" y="109" fill="#8bd5ca" font-size="13">trace();</text>
    <text x="39" y="135" fill="#8bd5ca" font-size="13">repeat();</text>
    <text x="22" y="151" fill="#c6a0f6" font-size="13">}</text>
  </g>
</svg>
